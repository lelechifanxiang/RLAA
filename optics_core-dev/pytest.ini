[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers -s
markers =
    regression: Stable behavior baselines and known-good outputs.
    contract: Public API and interface guarantees.
    benchmark: Performance-oriented tests that require --run-benchmark.
    zemax: External Zemax API comparisons for optical trace baselines.